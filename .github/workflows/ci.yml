name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B clean test package

      - name: Verify teacher workload and ordering baseline
        shell: bash
        run: |
          while IFS=$'\t' read -r teacher target; do
            [ "$teacher" = "teacher" ] && continue
            actual=$(awk -F'\t' -v t="$teacher" 'NR>1 && $3==t {n++} END {print n+0}' data/school-baseline.tsv)
            echo "$teacher target=$target actual=$actual"
            test "$actual" -eq "$target"
          done < data/teacher-targets.tsv

          python - <<'PY'
          import csv
          from collections import defaultdict

          main = {"语文", "数学"}
          rows = []
          with open("data/school-baseline.tsv", encoding="utf-8", newline="") as f:
              for r in csv.DictReader(f, delimiter="\t"):
                  r["period"] = int(r["period"])
                  rows.append(r)

          def verify_order(key_field, label):
              grouped = defaultdict(list)
              for r in rows:
                  grouped[(r[key_field], r["day"])].append(r)
              bad = []
              for (name, day), items in grouped.items():
                  mains = [r for r in items if r["subject"] in main]
                  secondary = [r for r in items if r["subject"] not in main]
                  for s in secondary:
                      later = [m for m in mains if m["period"] > s["period"]]
                      if later:
                          m = min(later, key=lambda x: x["period"])
                          bad.append((name, day, s, m))
              for name, day, s, m in bad:
                  print(f"{label} secondary-before-main: {name} {day}: "
                        f"{s['period']} {s['subject']} before {m['period']} {m['subject']}")
              if bad:
                  raise SystemExit(1)

          verify_order("class", "Class")
          verify_order("teacher", "Teacher")
          PY

      - name: Install exact repair solver
        run: python -m pip install --disable-pip-version-check ortools

      - name: Exact repair constrained timetable
        shell: bash
        run: |
          set -o pipefail
          python scripts/exact_repair.py \
            data/school-baseline.tsv \
            target/exact-baseline.tsv \
            --time-limit 120 | tee target/exact.log

      - name: Verify exact candidate with Timefold
        shell: bash
        run: |
          set -o pipefail
          java -jar target/temperature-timetable-0.1.0-SNAPSHOT.jar \
            target/exact-baseline.tsv \
            target/school-timetable-solved.xlsx | tee target/solve.log

      - name: Verify hard constraints, PE lock, and period-2 improvement
        shell: bash
        run: |
          grep -q "Solved score: 0hard/" target/solve.log
          grep -q "Changed lessons: 0" target/solve.log
          grep -q "Moved PE lessons: 0" target/solve.log
          grep -q "Lai Mingya secondary period-2 count: 0" target/solve.log
          before=$(awk -F'\t' 'NR>1 && $5==2 && $2!="语文" && $2!="数学" && $2!="体育" {n++} END {print n+0}' data/school-baseline.tsv)
          after=$(grep "Secondary period-2 preference count:" target/solve.log | awk '{print $5}')
          echo "secondary period-2 before=$before after=$after"
          test "$after" -le "$before"

      - name: Upload solved timetable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-timetable-solved
          path: |
            target/exact-baseline.tsv
            target/exact.log
            target/school-timetable-solved.xlsx
            target/solve.log
          if-no-files-found: error
