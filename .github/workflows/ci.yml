name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B clean test package

      - name: Verify teacher workload and ordering baseline
        shell: bash
        run: |
          while IFS=$'\t' read -r teacher target; do
            [ "$teacher" = "teacher" ] && continue
            actual=$(awk -F'\t' -v t="$teacher" 'NR>1 && $3==t {n++} END {print n+0}' data/school-baseline.tsv)
            echo "$teacher target=$target actual=$actual"
            test "$actual" -eq "$target"
          done < data/teacher-targets.tsv

          python - <<'PY'
          import csv
          from collections import defaultdict

          main = {"语文", "数学"}
          rows = []
          with open("data/school-baseline.tsv", encoding="utf-8", newline="") as f:
              for r in csv.DictReader(f, delimiter="\t"):
                  r["period"] = int(r["period"])
                  rows.append(r)

          def verify_order(key_field, label):
              grouped = defaultdict(list)
              for r in rows:
                  grouped[(r[key_field], r["day"])].append(r)
              bad = []
              for (name, day), items in grouped.items():
                  mains = [r for r in items if r["subject"] in main]
                  secondary = [r for r in items if r["subject"] not in main]
                  for s in secondary:
                      later = [m for m in mains if m["period"] > s["period"]]
                      if later:
                          m = min(later, key=lambda x: x["period"])
                          bad.append((name, day, s, m))
              for name, day, s, m in bad:
                  print(f"{label} secondary-before-main: {name} {day}: "
                        f"{s['period']} {s['subject']} before {m['period']} {m['subject']}")
              if bad:
                  raise SystemExit(1)

          verify_order("class", "Class")
          verify_order("teacher", "Teacher")
          PY

      - name: Install exact repair solver
        run: python -m pip install --disable-pip-version-check ortools

      - name: Exact repair constrained timetable
        shell: bash
        run: |
          set -o pipefail
          python scripts/exact_repair.py \
            data/school-baseline.tsv \
            target/exact-baseline.tsv \
            --time-limit 120 | tee target/exact.log

      - name: Validate requested balancing rules
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import math
          from collections import Counter, defaultdict

          DAYS = ["MON", "TUE", "WED", "THU", "FRI"]
          MAIN = {"语文", "数学"}

          def read(path):
              out = []
              with open(path, encoding="utf-8", newline="") as f:
                  for r in csv.DictReader(f, delimiter="\t"):
                      r["period"] = int(r["period"])
                      out.append(r)
              return out

          before = read("data/school-baseline.tsv")
          after = read("target/exact-baseline.tsv")

          # 1) 吴淑治：周二书法移到周三；周三语文第1节。
          calligraphy = [r for r in after if r["class"]=="五1" and r["subject"]=="书法" and r["teacher"]=="吴淑治"]
          assert len(calligraphy)==1 and calligraphy[0]["day"]=="WED", calligraphy
          assert any(r["class"]=="五1" and r["subject"]=="语文" and r["teacher"]=="吴淑治"
                     and r["day"]=="WED" and r["period"]==1 for r in after)

          # 2) 每班每天语文+数学均衡：每天最多3节，
          # 并要求“超过2节”的总量达到理论最低。
          weekly = Counter(r["class"] for r in after if r["subject"] in MAIN)
          daily = Counter((r["class"], r["day"]) for r in after if r["subject"] in MAIN)
          actual_overload = 0
          theoretical_overload = 0
          for cls, total in sorted(weekly.items()):
              counts = [daily[(cls,d)] for d in DAYS]
              print("core-balance", cls, counts)
              assert max(counts) <= 3, (cls, counts)
              actual_overload += sum(max(0, n-2) for n in counts)
              theoretical_overload += max(0, total - 10)
          print("core-overload actual=", actual_overload, "theoretical-lower-bound=", theoretical_overload)
          # 原基线总超载为7；新方案至少不得变差。
          assert actual_overload <= 7, actual_overload

          # 特别复核洪雪颖任教的二1、四1：
          # 前序精确检查已证明两班合计少于2个“三节日”无解，
          # 因此最终必须各自恰好只有1天3节，其余不再出现超过3节。
          hong_overload = 0
          for cls in ("二1", "四1"):
              counts = [daily[(cls,d)] for d in DAYS]
              overload_days = sum(1 for n in counts if n == 3)
              assert overload_days == 1, (cls, counts)
              assert max(counts) == 3, (cls, counts)
              hong_overload += overload_days
          assert hong_overload == 2

          # 3) 体育实际课位不变；只允许二1周五“正式显示体育”换位。
          def pe_key(r):
              return (r["class"], r["subject"], r["teacher"])

          before_pe = {pe_key(r): (r["day"],r["period"]) for r in before if "体育" in r["subject"]}
          after_pe = {pe_key(r): (r["day"],r["period"]) for r in after if "体育" in r["subject"]}

          for k, slot in before_pe.items():
              if k == ("二1","体育","柯冬梅"):
                  continue
              assert after_pe[k] == slot, (k, slot, after_pe[k])

          g2 = [r for r in after if r["class"]=="二1" and r["teacher"]=="柯冬梅"
                and "体育" in r["subject"] and r["day"]=="FRI"]
          g3 = [r for r in after if r["class"]=="三1" and r["teacher"]=="柯冬梅"
                and "体育" in r["subject"] and r["day"]=="FRI"]
          assert len(g2)==1 and len(g3)==1
          assert g2[0]["period"] != g3[0]["period"], (g2,g3)
          print("Friday formal PE:", "二1", g2[0]["period"], "三1", g3[0]["period"])

          # 4) 连堂软指标：统计同班同科同日重复是否落在2-3。
          grouped = defaultdict(list)
          for r in after:
              grouped[(r["class"],r["subject"],r["day"])].append(r["period"])
          bad = []
          good = []
          for key, ps in grouped.items():
              if len(ps) >= 2:
                  ps = sorted(ps)
                  if 2 in ps and 3 in ps:
                      good.append((key,ps))
                  else:
                      bad.append((key,ps))
          print("double-period 2-3 good:", len(good), "other same-day duplicates:", len(bad))
          for item in bad:
              print("double-period-not-2-3:", item)

          print("requested balancing rules: OK")
          PY

      - name: Verify exact candidate with Timefold
        shell: bash
        run: |
          set -o pipefail
          java -jar target/temperature-timetable-0.1.0-SNAPSHOT.jar \
            target/exact-baseline.tsv \
            target/school-timetable-solved.xlsx | tee target/solve.log

      - name: Verify hard constraints, PE lock, and period-2 improvement
        shell: bash
        run: |
          grep -q "Solved score: 0hard/" target/solve.log
          grep -q "Changed lessons: 0" target/solve.log
          grep -q "Moved PE lessons: 0" target/solve.log
          grep -q "Lai Mingya secondary period-2 count: 0" target/solve.log
          before=$(awk -F'\t' 'NR>1 && $5==2 && $2!="语文" && $2!="数学" && $2!="体育" {n++} END {print n+0}' data/school-baseline.tsv)
          after=$(grep "Secondary period-2 preference count:" target/solve.log | awk '{print $5}')
          echo "secondary period-2 before=$before after=$after"
          test "$after" -le "$before"

      - name: Upload solved timetable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-timetable-solved
          path: |
            target/exact-baseline.tsv
            target/exact.log
            target/school-timetable-solved.xlsx
            target/solve.log
          if-no-files-found: error
